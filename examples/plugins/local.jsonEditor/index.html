<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'" />
    <title>JSON 编辑器</title>
    <style>
      :root { color-scheme: light dark; font: 13px/1.5 system-ui, sans-serif; }
      body { margin: 0; background: Canvas; color: CanvasText; }
      main { display: grid; height: 100vh; grid-template-rows: auto minmax(0, 1fr) auto; }
      header, footer { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-block-end: 1px solid color-mix(in srgb, CanvasText 18%, transparent); }
      footer { border-block: 1px solid color-mix(in srgb, CanvasText 18%, transparent) 0; }
      input { flex: 1; min-width: 120px; }
      input, button, textarea { font: inherit; }
      input, button { min-height: 30px; padding: 0 8px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 5px; background: Canvas; color: CanvasText; }
      textarea { width: 100%; height: 100%; box-sizing: border-box; resize: none; border: 0; padding: 12px; outline: 0; background: Canvas; color: CanvasText; font-family: ui-monospace, monospace; }
      #status { margin-left: auto; }
    </style>
  </head>
  <body>
    <main>
      <header><strong>JSON 编辑器</strong><input id="path" aria-label="工作区相对路径" placeholder="config.json" /><button id="load" type="button">读取</button><button id="format" type="button">格式化</button><button id="save" type="button">保存</button></header>
      <textarea id="editor" aria-label="JSON 内容" spellcheck="false"></textarea>
      <footer><span>Plugin API v3</span><span id="status">等待连接</span></footer>
    </main>
    <script type="module" src="v3.js"></script>
  </body>
</html>
